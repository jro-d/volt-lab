name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1). Leave blank to use package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply manual release version (if provided)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}".TrimStart('v')
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Run smoke tests
        run: npm test

      - name: Generate desktop app icons
        run: node scripts/generate-icons.mjs

      - name: Build production web bundle
        run: npm run build

      - name: Prepare draft GitHub Release before parallel asset uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (node -p "require('./package.json').version").Trim()
          $tag = "v$ver"
          $null = gh release view $tag --json tagName 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $ver --generate-notes --target ${{ github.sha }}
          }

      - name: Package Windows Installer & Portable EXE and upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (node -p "require('./package.json').version").Trim()
          $tag = "v$ver"
          gh release edit $tag --draft=false --latest

      - name: Upload EXE artifacts to workflow run
        uses: actions/upload-artifact@v7
        with:
          name: wirewise-windows-desktop
          path: |
            release/*.exe
            release/latest.yml
