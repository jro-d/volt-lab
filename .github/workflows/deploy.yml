name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Assemble site (download page at the root, web app under /app)
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r dist/. _site/app/

      - name: Stamp icons and service worker with this commit (so browsers drop cached copies)
        run: |
          v="${GITHUB_SHA::7}"
          # Download page: versioned icon URLs bypass the browser cache and the old root service worker's cache
          sed -i -E "s/(icon\.svg|icon-256\.png)\"/\1?v=$v\"/g" _site/index.html
          # Web app: a changed sw.js installs a new worker, whose activate step deletes the old cache
          sed -i -E "s/(const CACHE = 'wirewise-shell-[^']*)'/\1-$v'/" _site/app/sw.js
          sed -i -E "s/\"src\": \"icon\.svg\"/\"src\": \"icon.svg?v=$v\"/g" _site/app/manifest.webmanifest
          grep -c "?v=$v" _site/index.html _site/app/manifest.webmanifest
          grep -n "const CACHE" _site/app/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
