der → 3P MCB → Contactor KM1 → Thermal Overload F2 → 3Φ Motor",category:"industrial",badge:"⚓ Marine 440V",difficulty:"Intermediate",description:"A shipboard-style Direct-On-Line starter. The 440V 60Hz 3-phase feeder supplies the motor through the main 3P MCB, the line contactor KM1 and the thermal overload relay F2. A 2P control MCB feeds the primary H1-H2 of a 440/220V control transformer; its secondary X1 powers the 220V control rung: OLR 95-96 → STOP 1-2 → START 3-4 with the KM1 13-14 seal-in in parallel → coil A1-A2 → X2.",objectives:["Press ▶ Simulate: the transformer secondary goes live (TC1 shows SEC 220V ●) and the phase lamps on the feeder light up.","Hold START on S1 (or on the ladder): KM1 pulls in, 13-14 seals the circuit and the motor spins CW (FORWARD). Release START — the motor keeps running.","Open the KM1 🔍 X-RAY cutaway to watch the armature pull the copper bridges onto the fixed contacts.","Press TEST on F2 (or set its dial below the motor current): 95-96 opens, KM1 drops out and PL_FAULT lights via 97-98. Press R to reset.","Switch to Ladder Logic → Rung Builder, draw the circuit yourself and click Verify Against Physical Wiring."],project:{id:"proj_marine_dol_440v",title:"Marine DOL Starter 440V / 220V Control",description:"440V 3-phase DOL starter with control transformer, contactor and thermal overload relay.",codeStandard:"PEC",gridVoltage:440,gridFrequency:60,systemEarthing:"TN-S",devices:ox,wires:sx,targetLadder:cx}},{id:"lab-forward-reverse-interlock",title:"🔄 Forward-Reverse 3-Phase Motor Starter with Electrical Interlocking",subtitle:"Worksheet — FOR & REV contactors, T1/T3 phase reversal, 21-22 NC cross-interlocks, TOR & FWD/REV/STOP station",category:"industrial",badge:"🔄 FWD / REV",difficulty:"Advanced",description:"Reversing a 3-phase induction motor means swapping any two supply lines. KM1 (FOR) connects L1-L2-L3 straight to U1-V1-W1; KM2 (REV) swaps T1 and T3, so the motor sees L3-L2-L1 and turns counter-clockwise. Because closing both at once would bolt L1 to L3, each coil is fed through the other contactor's 21-22 NC auxiliary contact (electrical interlock).",objectives:["Simulate, then hold FWD: KM1 latches through 13-14 and the motor badge shows ⟳ CW FWD.","While running forward, press REV — nothing happens: KM1 21-22 is open and blocks the reverse coil. Press STOP, then REV to see ⟲ CCW REV.","Watch the Ladder Logic view in Dual View highlight each closed contact and the blocked interlock in red.","Force both contactor test plungers in (Inspector → Test Plunger) to bypass the interlock: the solver detects L1 shorted to L3, sparks an arc flash and trips Q1.","In Rung Builder, remove the KM2 21-22 contact from rung 1 and Verify — then rewire the physical circuit without the interlock and compare."],project:{id:"proj_forward_reverse_interlock",title:"Forward-Reverse Starter with Interlocks",description:"440V reversing starter: FOR/REV contactors, T1-T3 reversal, 21-22 interlocks, overload relay.",codeStandard:"PEC",gridVoltage:440,gridFrequency:60,systemEarthing:"TN-S",devices:dx,wires:ux,targetLadder:mx}},{id:"lab-wye-delta-starter",title:"★▲ Wye-Delta (Y-Δ) Reduced-Voltage Motor Starter (6-Lead 7.5 HP + Timer KT1)",subtitle:"Automated Y-Δ Starter — KM1 Line + KMY Star + KMD Delta + KT1 5s On-Delay Changeover + Interlocks",category:"industrial",badge:"★▲ Wye-Delta Y-Δ",difficulty:"Advanced",description:"Industrial 440V Wye-Delta reduced-voltage starter for a 6-lead 7.5 HP induction motor (U1-V1-W1 & W2-U2-V2). Pressing START energizes KM1 (Main) and KMY (Star), shorting W2-U2-V2 to cut starting line current to 1/3 of DOL. After KT1 counts down 5 seconds, 15-16 opens KMY and 15-18 closes KMD (Delta) for full 440V phase-to-phase torque.",objectives:["Press ▶ Simulate and click START on S1: observe KM1 + KMY pull in, PL_STAR glow amber, and M1 display ★ WYE 1/3 I at reduced current (~2.8A instead of 8.5A).","Watch KT1 count up to 5.0s: 15-16 drops KMY, 15-18 closes KMD, PL_DELTA turns green, and M1 shifts automatically into ▲ DELTA RUN (~8.5A).","Inspect KMY and KMD 21-22 NC cross-interlocks in Dual View (Ladder Logic): try forcing KMY test plunger while in Delta — the solver catches the bolted Star-Delta short!","Adjust KT1 delay in the Device Inspector (e.g. 3s vs 8s) and verify how star duration changes before Delta changeover."],project:{id:"proj_wye_delta_starter",title:"Wye-Delta (Y-Δ) Reduced-Voltage Starter (440V / 220V)",description:"6-lead induction motor starter with KM1 Line, KMY Star, KMD Delta, KT1 on-delay timer, and 21-22 interlocks.",codeStandard:"PEC",gridVoltage:440,gridFrequency:60,systemEarthing:"TN-S",devices:fx,wires:hx,targetLadder:px}}],{id:"lab-ph-residential-acu-combo",title:"🇵🇭 Residential Branch Circuit: ACU Safety Breaker & Modular Switch-Outlet Combo",subtitle:"PEC 2017 Art. 4.40 & Art. 4.4 / 4.6 Philippine Residential Installation",category:"residential",badge:"🇵🇭 PEC Residential",difficulty:"Intermediate",description:"A realistic Philippine residential branch circuit built from standard (brand-neutral) devices: 2P Main Breaker on DIN rail, Octagonal Orange PVC Junction Box distributing to a 2P 30A Enclosed Safety Breaker for a 1.5 HP Inverter Air Conditioner (PEC Art. 4.40), and a Wide-Series Combo Plate (1-Way Switch controlling a ceiling light + Neon Red Pilot Lamp + Universal 3-Prong Grounded Outlet).",objectives:["Understand how Philippine residential installations use 2-pole breakers for 230V line-to-line electrical systems.","Inspect the 2P 30A Safety Breaker local disconnect installed within sight of the 1.5 HP Air Conditioner (PEC 4.40.2.1).","Examine the Wide-Series Combo Plate in Rear View and trace the common live jumper strap across the switch, pilot lamp, and convenience receptacle.","Toggle the Safety Breaker cover open/closed to inspect the internal 2P bolt-on breaker mechanism, copper lugs, and equipment grounding."],project:{id:"proj_ph_residential_acu_combo",title:"Residential Installation: ACU Disconn
