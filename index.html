<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23b4501c%22/><path d=%22M13 2 4 14h7l-1 8 9-12h-7z%22 fill=%22white%22/></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#b4501c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved or system theme before first paint.
      (function () {
        try {
          var saved = localStorage.getItem("wirewise-theme");
          if (!saved) {
            // Preference saved before the VoltLab -> WireWise rename: copy it over once
            var old = localStorage.getItem("voltlab-theme");
            if (old) {
              saved = old;
              localStorage.setItem("wirewise-theme", old);
              localStorage.removeItem("voltlab-theme");
            }
          }
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WireWise - Electrical Installation Simulator & Code Planner (PEC / IEC)</title>
  </head>
  <body class="bg-canvas text-ink antialiased select-none overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
